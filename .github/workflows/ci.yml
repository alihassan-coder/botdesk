# Runs on every pull request and every push to main:
# type checks, linting and tests for the web app, the API, the plugin SDK and the built-in
# plugins (`pnpm check`).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Type check, lint and test
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Real Postgres (with pgvector, for memory) so the runtime tests run here too.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: botdesk
          POSTGRES_PASSWORD: botdesk
          POSTGRES_DB: botdesk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U botdesk"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgresql://botdesk:botdesk@localhost:5432/botdesk_test

    steps:
      - uses: actions/checkout@v4

      # pnpm version comes from "packageManager" in package.json.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install JavaScript packages
        run: pnpm install --frozen-lockfile

      # One uv workspace at the repo root (ADR 0006): the API, packages/plugin-sdk and plugins/*
      # share one lockfile and one .venv. --all-packages installs every member, not just one.
      - name: Install Python packages
        run: uv sync --frozen --all-packages

      - name: Check web and API
        run: pnpm check
