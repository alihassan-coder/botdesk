[project]
name = "botdesk-plugin-gmail"
version = "0.1.0"
description = "BotDesk Gmail plugin: connect a Google account; search, read, organise, draft and send its email, and react to new mail."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
# A plugin depends on the SDK (and its own libraries), never on the BotDesk app.
dependencies = ["botdesk-plugin-sdk", "pydantic>=2.11"]

# How BotDesk finds the plugin: the name is the plugin id, the value returns its manifest.
[project.entry-points."botdesk.plugins"]
gmail = "botdesk_gmail:gmail_plugin"

[tool.uv.sources]
botdesk-plugin-sdk = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/botdesk_gmail"]

[dependency-groups]
dev = [
    "mypy>=2.4.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.4.1.post1",
    "ruff>=0.17.4",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC", "S", "RUF"]
ignore = ["S101"]  # assert is how pytest checks things

[tool.mypy]
python_version = "3.13"
strict = true
plugins = ["pydantic.mypy"]
files = ["src", "tests"]
