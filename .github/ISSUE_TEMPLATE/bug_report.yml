name: Bug report
description: Something doesn't work the way it should
title: "bug: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report this! For **security problems**, please don't use this form; email alihassan.coder@gmail.com instead (see SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you see, and what did you expect to see instead?
      placeholder: When I approve an edited email, the bot sends the original text.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: The smallest set of steps that shows the problem.
      placeholder: |
        1. Sign in as ali@acme.dev
        2. Open the Inbox Manager chat
        3. Click Edit on the approval card, change the body, click Approve
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Web app
        - API / backend
        - Docs
        - Not sure
    validations:
      required: true
  - type: dropdown
    id: data-mode
    attributes:
      label: Demo data or real API?
      options:
        - Demo data (no API)
        - Real API (NEXT_PUBLIC_API_URL set)
        - Not sure
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, browser, and the commit or version you're on.
      placeholder: Windows 11, Chrome 140, commit 125f1b9
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      description: Error messages from the terminal or browser console help a lot. Remove any secrets first.
      render: shell
