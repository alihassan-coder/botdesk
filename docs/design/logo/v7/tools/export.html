<!doctype html>
<html><head><meta charset="utf-8"><title>bd export</title>
<!-- Builds every logo file from mark.js + Geist outlines. Run by opening this page and calling window.build(). -->
<script src="https://cdn.jsdelivr.net/npm/opentype.js@1.3.4/dist/opentype.min.js"></script>
<script src="../mark.js"></script>
</head><body>
<script>
const INK = '#000000', PAPER = '#FFFFFF', ULTRA = '#3B30FF';
const FONT_URL = 'https://cdn.jsdelivr.net/npm/geist@1.3.1/dist/fonts/geist-sans/Geist-SemiBold.ttf';
const r2 = v => +v.toFixed(2);

// Tight box around the mark (stroke included), in the mark's own 100-unit space.
const SW = 10.5, LOCK_SW = 14, G = bdGeometry(); // lockups use a heavier line to match the SemiBold wordmark
const boxFor = sw => ({ x: G.Lx - G.r - sw / 2, y: G.top - sw / 2, w: (G.Rx + G.r) - (G.Lx - G.r) + sw, h: (G.cy + G.r) - G.top + sw });
const BOX = boxFor(SW), LBOX = boxFor(14);

function markGroup(color, sw = SW, tx = 0, ty = 0, s = 1) {
  return `<g transform="translate(${r2(tx)} ${r2(ty)}) scale(${r2(s * 1000) / 1000})" fill="none" stroke="${color}" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round"><path d="${G.stems}"/><path d="${G.loop}"/></g>`;
}
const svg = (w, h, body, extra = '') => `<svg xmlns="http://www.w3.org/2000/svg" width="${r2(w)}" height="${r2(h)}" viewBox="0 0 ${r2(w)} ${r2(h)}"${extra}>${body}</svg>\n`;

// Mark alone, cropped tight, 100 units tall-ish.
function markSVG(color, sw = SW) {
  const B = boxFor(sw); return svg(B.w, B.h, markGroup(color, sw, -B.x, -B.y));
}

// Wordmark: "botdesk" laid out glyph by glyph with kerning and -0.045em tracking.
let FONT;
function wordPath(size, x, baseline) {
  const glyphs = FONT.stringToGlyphs('botdesk'), scale = size / FONT.unitsPerEm, track = -0.045 * size;
  let d = '', pen = x;
  glyphs.forEach((g, i) => {
    d += g.getPath(pen, baseline, size).toPathData(2);
    pen += g.advanceWidth * scale + track;
    if (glyphs[i + 1]) pen += FONT.getKerningValue(g, glyphs[i + 1]) * scale;
  });
  const p = new opentype.Path(); // measure
  const tmp = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
  tmp.innerHTML = `<path d="${d}"/>`; document.body.appendChild(tmp);
  const bb = tmp.firstChild.getBBox(); tmp.remove();
  return { d, bb };
}

// Horizontal lockup: mark height = 1.22 × the height of the "b"; mark bottom sits on the baseline (round overshoot below).
function lockup(color, layout = 'row') {
  const size = 100, ascB = FONT.charToGlyph('b').getBoundingBox().y2 * size / FONT.unitsPerEm;
  const markH = ascB * 1.22, s = markH / LBOX.h, markW = LBOX.w * s;
  const pad = 0;
  if (layout === 'row') {
    const gap = markH * 0.36, baseline = markH - markH * 0.035;
    const w = wordPath(size, markW + gap, baseline);
    const W = w.bb.x + w.bb.width, H = Math.max(markH, w.bb.y + w.bb.height);
    return svg(W + pad, H, markGroup(color, LOCK_SW, -LBOX.x * s, -LBOX.y * s, s) + `<path fill="${color}" d="${w.d}"/>`);
  }
  // stacked: mark centred above the word
  const big = markH * 1.9, sb = big / BOX.h, bw = BOX.w * sb; // stacked mark is large: standard weight keeps the bowls open
  const w0 = wordPath(size, 0, 0); const ww = w0.bb.width;
  const W = Math.max(bw, ww), gap = big * 0.24, baseline = big + gap + ascB;
  const w = wordPath(size, (W - ww) / 2 - w0.bb.x, baseline);
  return svg(W, w.bb.y + w.bb.height, markGroup(color, SW, (W - bw) / 2 - BOX.x * sb, -BOX.y * sb, sb) + `<path fill="${color}" d="${w.d}"/>`);
}
function wordmark(color) {
  const w = wordPath(100, 0, 100);
  return svg(w.bb.width, w.bb.height, `<path transform="translate(${r2(-w.bb.x)} ${r2(-w.bb.y)})" fill="${color}" d="${w.d}"/>`);
}

// App icon: 1024 tile, mark 60% of the tile wide. rounded = macOS/web style corners; square = store/iOS (the OS masks it).
function appIcon(bg, fg, rounded = true, size = 1024, sw = SW) {
  const s = size * 0.6 / BOX.w, mw = BOX.w * s, mh = BOX.h * s;
  const tile = rounded ? `<rect width="${size}" height="${size}" rx="${size * 0.225}" fill="${bg}"/>` : `<rect width="${size}" height="${size}" fill="${bg}"/>`;
  return svg(size, size, tile + markGroup(fg, sw, (size - mw) / 2 - BOX.x * s, (size - mh) / 2 - BOX.y * s + size * 0.01, s));
}
// Favicon: transparent, follows the browser theme.
function faviconSVG() {
  const B = boxFor(12); return svg(B.w, B.h, `<style>path{stroke:#000}@media (prefers-color-scheme: dark){path{stroke:#fff}}</style>` +
    `<g transform="translate(${r2(-B.x)} ${r2(-B.y)})" fill="none" stroke-width="12" stroke-linecap="round" stroke-linejoin="round"><path d="${G.stems}"/><path d="${G.loop}"/></g>`);
}

// Social images: big, quiet compositions.
function social(w, h, layout) {
  const ascB = FONT.charToGlyph('b').getBoundingBox().y2 / FONT.unitsPerEm;
  if (layout === 'avatar') return appIcon(INK, PAPER, false, w);
  if (layout === 'banner') {
    const s = h * 0.34 / BOX.h, mw = BOX.w * s;
    return svg(w, h, `<rect width="${w}" height="${h}" fill="${INK}"/>` + markGroup(PAPER, SW, w - mw - h * 0.33 - BOX.x * s, (h - BOX.h * s) / 2 - BOX.y * s, s));
  }
  // og / github: mark + word centred, line underneath
  const size = h * 0.15, markH = ascB * size * 1.22, s = markH / LBOX.h, markW = LBOX.w * s, gap = markH * 0.36;
  const w0 = wordPath(size, 0, 0), total = markW + gap + w0.bb.width, x0 = (w - total) / 2;
  const baseline = h * 0.5 + markH / 2 - markH * 0.035;
  const word = wordPath(size, x0 + markW + gap - w0.bb.x, baseline);
  const tag = wordPath; // (tagline drawn as text below, Geist via outlines too)
  const glyphs = FONT.stringToGlyphs('Your AI team. Always on.'), ts = h * 0.04, sc = ts / FONT.unitsPerEm;
  let tw = 0; glyphs.forEach(g => tw += g.advanceWidth * sc - 0.01 * ts);
  let pen = (w - tw) / 2, td = ''; const tb = baseline + h * 0.17;
  const reg = window.FONT_REG || FONT; const rg = reg.stringToGlyphs('Your AI team. Always on.');
  let tw2 = 0; rg.forEach(g => tw2 += g.advanceWidth * ts / reg.unitsPerEm - 0.01 * ts); pen = (w - tw2) / 2;
  rg.forEach(g => { td += g.getPath(pen, tb, ts).toPathData(2); pen += g.advanceWidth * ts / reg.unitsPerEm - 0.01 * ts; });
  return svg(w, h, `<rect width="${w}" height="${h}" fill="${INK}"/>` +
    markGroup(PAPER, LOCK_SW, x0 - LBOX.x * s, baseline - markH + markH * 0.035 - LBOX.y * s, s) +
    `<path fill="${PAPER}" d="${word.d}"/><path fill="#8E8E93" d="${td}"/>`);
}

// Rasterise an SVG string to PNG at an exact pixel size; returns base64.
function png(svgText, w, h) {
  return new Promise((res, rej) => {
    const img = new Image();
    img.onload = () => { const c = document.createElement('canvas'); c.width = w; c.height = h;
      const x = c.getContext('2d'); x.imageSmoothingQuality = 'high'; x.drawImage(img, 0, 0, w, h);
      res(c.toDataURL('image/png').split(',')[1]); };
    img.onerror = rej;
    img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svgText);
  });
}
const aspect = t => { const m = t.match(/viewBox="0 0 ([\d.]+) ([\d.]+)"/); return +m[1] / +m[2]; };

window.build = async () => {
  FONT = await opentype.load(FONT_URL);
  window.FONT_REG = await opentype.load(FONT_URL.replace('SemiBold', 'Regular'));
  const svgs = {
    'mark-black.svg': markSVG(INK), 'mark-white.svg': markSVG(PAPER), 'mark-ultramarine.svg': markSVG(ULTRA),
    'lockup-black.svg': lockup(INK), 'lockup-white.svg': lockup(PAPER), 'lockup-ultramarine.svg': lockup(ULTRA),
    'lockup-stacked-black.svg': lockup(INK, 'stack'), 'lockup-stacked-white.svg': lockup(PAPER, 'stack'),
    'wordmark-black.svg': wordmark(INK), 'wordmark-white.svg': wordmark(PAPER),
    'app-icon.svg': appIcon(INK, PAPER), 'app-icon-ultramarine.svg': appIcon(ULTRA, PAPER), 'app-icon-white.svg': appIcon(PAPER, INK),
    'favicon.svg': faviconSVG(),
  };
  const pngs = {};
  for (const n of [16, 32, 48, 64, 128, 192, 256, 512, 1024])
    pngs[`app-icon-${n}.png`] = await png(appIcon(INK, PAPER, true, 1024, n <= 32 ? 13 : n <= 64 ? 12 : SW), n, n);
  pngs['app-icon-ultramarine-1024.png'] = await png(appIcon(ULTRA, PAPER, true, 1024), 1024, 1024);
  pngs['app-icon-white-1024.png'] = await png(appIcon(PAPER, INK, true, 1024), 1024, 1024);
  pngs['apple-touch-icon.png'] = await png(appIcon(INK, PAPER, false, 1024), 180, 180);
  pngs['app-store-1024.png'] = await png(appIcon(INK, PAPER, false, 1024), 1024, 1024);
  for (const n of [16, 32, 48]) pngs[`favicon-${n}.png`] = await png(appIcon(INK, PAPER, true, 1024, n <= 32 ? 13 : 12), n, n);
  for (const [name, col] of [['black', INK], ['white', PAPER], ['ultramarine', ULTRA]])
    for (const n of [64, 128, 256, 512, 1024]) { const t = markSVG(col, n <= 64 ? 12 : SW); pngs[`mark-${name}-${n}.png`] = await png(t, Math.round(n * aspect(t)), n); }
  for (const [name, col] of [['black', INK], ['white', PAPER]]) {
    const t = lockup(col); pngs[`lockup-${name}-200h.png`] = await png(t, Math.round(200 * aspect(t)), 200);
    const ts = lockup(col, 'stack'); pngs[`lockup-stacked-${name}-600h.png`] = await png(ts, Math.round(600 * aspect(ts)), 600);
  }
  const og = social(1200, 630, 'og'); svgs['og-image.svg'] = og; pngs['og-image-1200x630.png'] = await png(og, 1200, 630);
  const gh = social(1280, 640, 'og'); pngs['github-social-1280x640.png'] = await png(gh, 1280, 640);
  pngs['avatar-800.png'] = await png(social(800, 800, 'avatar'), 800, 800);
  pngs['banner-1500x500.png'] = await png(social(1500, 500, 'banner'), 1500, 500);
  return { svgs, pngs };
};
</script>
</body></html>
