# Local development database: Postgres 17 with pgvector (for memory), on localhost:5432.
# For contributors without Neon. Not for production (fixed password, port open on this machine).
#
#   docker compose -f deploy/docker-compose.dev.yml up -d
#
# Then in apps/api/.env:
#   DATABASE_URL=postgresql://botdesk:botdesk@localhost:5432/botdesk
#   TEST_DATABASE_URL=postgresql://botdesk:botdesk@localhost:5432/botdesk_test   # optional: Postgres tests
#
# Stop it with `down`; add `-v` to delete the data too.

name: botdesk-dev

services:
  postgres:
    image: pgvector/pgvector:pg17
    restart: unless-stopped
    environment:
      POSTGRES_USER: botdesk
      POSTGRES_PASSWORD: botdesk
      POSTGRES_DB: botdesk
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data
      # Creates the separate, throwaway database for the Postgres tests on first start.
      - ./postgres-dev-init.sql:/docker-entrypoint-initdb.d/10-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U botdesk -d botdesk"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  postgres-dev-data:
